# Deploys the web build (frontend only) to GitHub Pages. The desktop app is
# released separately by release.yml; this site is a UI preview without the
# Rust backend, so import/reading stays desktop-only.
name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with Pages base path
        run: pnpm exec vite build
        env:
          # Derived from the repo name, never hardcoded: the 2026-10-21 rename
          # (ColorReader → fangce) missed this line, so the deployed HTML kept
          # pointing at /ColorReader/assets/* (404) while the site lived at
          # /fangce/ — a blank page that still returns 200.
          PAGES_BASE: /${{ github.event.repository.name }}/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # upload-pages-artifact reports success and hands back an artifact ID,
      # but the list endpoint deploy-pages queries can still return 0 for a
      # beat (seen 2026-11-23: ID 14832738630 uploaded at :11.221, deploy at
      # :11.861 found none). deploy-pages@v4 does not retry, so the whole
      # deployment failed on an artifact that was there all along. Probe the
      # same endpoint it uses until the artifact shows up before handing over.
      - name: Wait for the Pages artifact to become visible
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" -ge 1 ]; then
              echo "Pages artifact visible after ${attempt} attempt(s)"
              exit 0
            fi
            echo "Attempt ${attempt}: artifact not listed yet, retrying in 5s"
            sleep 5
          done
          echo "Pages artifact was uploaded but never became visible" >&2
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
